<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AWS Diagram Studio</title>
<!--
  AWS Diagram Studio — a single-file AWS architecture diagram editor.
  Icons: AWS Architecture Icons, embedded from the MIT-licensed "aws-icons" npm package.
  PDF export uses jsPDF + svg2pdf.js and GIF export uses gifenc, each loaded from jsDelivr only when used.
-->
<style>
:root{--ink:#232F3E;--mute:#687078;--line:#D5DBDB;--bg:#F2F3F3;--panel:#fff;--accent:#2563EB;--accent-soft:#E8EFFD;--orange:#EC7211}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:13px/1.4 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);display:grid;grid-template-rows:48px 1fr;grid-template-columns:276px 1fr 244px;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
header{grid-column:1/4;display:flex;align-items:center;gap:6px;padding:0 10px;background:var(--ink);color:#fff;min-width:0}
.brand{font-weight:600;letter-spacing:.2px;margin-right:6px;white-space:nowrap;display:flex;align-items:center;gap:8px}
.brand i{width:18px;height:18px;border-radius:4px;background:var(--orange);display:inline-block;position:relative}
.brand i:after{content:"";position:absolute;inset:5px;border:2px solid #fff;border-radius:1px}
#title{background:#37475A;border:1px solid transparent;color:#fff;border-radius:4px;padding:5px 8px;width:200px;min-width:90px}
#title:focus{outline:none;border-color:#8FB3FF;background:#2B3A4D}
.sep{width:1px;height:22px;background:#4A5B70;margin:0 4px;flex:none}
.tb{background:transparent;border:1px solid transparent;color:#fff;border-radius:4px;padding:5px 9px;cursor:pointer;white-space:nowrap}
.tb:hover{background:#37475A}
.tb:disabled{opacity:.35;cursor:default;background:transparent}
.tb.primary{background:var(--orange);font-weight:600}
.tb.primary:hover{background:#F08A2E}
.tb.on{background:#37475A;border-color:#5C6F86}
.grow{flex:1}
#zoomlbl{min-width:44px;text-align:center;font-variant-numeric:tabular-nums;color:#D5DBDB}
aside{background:var(--panel);overflow:auto;min-height:0}
#left{border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
#search{margin:10px;padding:7px 10px;border:1px solid var(--line);border-radius:6px;width:calc(100% - 20px)}
#search:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
#palette{overflow:auto;flex:1;padding:0 10px 16px}
.cat{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--mute);margin:12px 2px 6px;cursor:pointer;user-select:none;display:flex;justify-content:space-between}
.cat:hover{color:var(--ink)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.tiles.hide{display:none}
.tile{background:#fff;border:1px solid transparent;border-radius:6px;padding:7px 2px 5px;cursor:grab;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;line-height:1.2;text-align:center;min-height:70px}
.tile:hover{border-color:var(--line);background:#FAFAFA}
.tile:active{cursor:grabbing}
.tile svg{width:36px;height:36px;flex:none;pointer-events:none}
.tile span{pointer-events:none;overflow-wrap:anywhere}
.gtile{display:flex;align-items:center;gap:8px;width:100%;background:#fff;border:1px solid transparent;border-radius:6px;padding:5px 6px;cursor:grab;text-align:left;font-size:12px}
.gtile:hover{border-color:var(--line);background:#FAFAFA}
.gtile b{width:26px;height:18px;border:1.5px solid;border-radius:2px;flex:none;pointer-events:none}
.glist{display:grid;grid-template-columns:1fr 1fr;gap:2px}
.glist.hide{display:none}
#stage{position:relative;overflow:hidden;background-color:#fff;background-image:radial-gradient(#C9D1D9 1px,transparent 1.2px);cursor:default;min-width:0;min-height:0}
#stage.nogrid{background-image:none}
#stage.pan{cursor:grab}
#stage.panning{cursor:grabbing}
#svg{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;touch-action:none}
.node,.txt{cursor:move}
.port{opacity:0;cursor:crosshair;transition:opacity .08s}
.node:hover .port,.linking .port{opacity:1}
.port:hover{fill:var(--accent)}
.ghit{cursor:move}
.ehit{cursor:pointer}
[data-handle]{cursor:nwse-resize}
[data-handle=ne],[data-handle=sw]{cursor:nesw-resize}
#editor{position:absolute;display:none;resize:none;border:1.5px solid var(--accent);border-radius:4px;padding:2px 6px;background:#fff;outline:none;line-height:1.25;overflow:hidden;box-shadow:0 2px 10px rgba(35,47,62,.18);z-index:5;white-space:pre}
#right{border-left:1px solid var(--line);padding:12px}
#right h3{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--mute);margin:0 0 8px}
#right label{display:block;font-size:11px;color:var(--mute);margin:10px 0 3px}
#right input[type=text],#right textarea,#right select{width:100%;border:1px solid var(--line);border-radius:5px;padding:6px 8px;background:#fff}
#right textarea{resize:vertical;min-height:54px}
#right input:focus,#right textarea:focus,#right select:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.seg{display:flex;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.seg button{flex:1;border:0;background:#fff;padding:6px 4px;cursor:pointer;border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.sw{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.sw button{width:22px;height:22px;border-radius:5px;border:1px solid rgba(0,0,0,.18);cursor:pointer;padding:0;background:#fff;font-size:12px;line-height:1;color:var(--mute)}
.sw button.on{outline:2px solid var(--accent);outline-offset:1px}
.sw input{width:28px;height:24px;padding:0;border:1px solid var(--line);border-radius:5px;background:#fff;cursor:pointer}
.btn{border:1px solid var(--line);background:#fff;border-radius:5px;padding:6px 10px;cursor:pointer}
.btn:hover{background:#F7F8F8}
.btn.danger{color:#B42318}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.grid6{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.tips{color:var(--mute);font-size:12px}
.tips p{margin:0 0 9px}
.tips b{color:var(--ink);font-weight:600}
kbd{font:11px ui-monospace,Consolas,monospace;background:#F2F3F3;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px}
#toast{position:absolute;left:50%;bottom:74px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 14px;border-radius:6px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9;white-space:nowrap}
#toast.show{opacity:.95}
.menu{position:relative}
.mlist{display:none;position:absolute;top:36px;left:0;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(35,47,62,.2);padding:4px;z-index:30;min-width:230px}
.menu.open .mlist{display:block}
.mlist button{display:flex;justify-content:space-between;align-items:baseline;gap:14px;width:100%;border:0;background:none;padding:8px 10px;border-radius:5px;cursor:pointer;color:var(--ink);text-align:left;white-space:nowrap}
.mlist button:hover{background:var(--accent-soft)}
.mlist small{color:var(--mute)}
#tabs{position:absolute;left:10px;bottom:10px;display:flex;gap:3px;z-index:6;max-width:55%;overflow:auto}
.tab{border:1px solid var(--line);background:#fff;border-radius:6px;padding:4px 10px;cursor:pointer;white-space:nowrap;font-size:12px;color:var(--mute)}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tab span{margin-left:8px;opacity:.65}
.tab span:hover{opacity:1}
.tab input{font:inherit;width:96px;border:0;outline:0;background:transparent;color:inherit;padding:0}
#playbar{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:none;align-items:center;gap:6px;background:var(--ink);color:#fff;border-radius:10px;padding:8px 10px;z-index:7;max-width:72%;box-shadow:0 6px 22px rgba(35,47,62,.3)}
#playbar button{background:#37475A;border:0;color:#fff;border-radius:6px;min-width:30px;height:28px;cursor:pointer;flex:none}
#playbar button:hover{background:#4A5B70}
#playbar div{padding:0 8px;font-size:13px;line-height:1.35}
#playbar b{color:#FFB366;margin-right:8px;white-space:nowrap}
#modal{position:fixed;inset:0;background:rgba(35,47,62,.45);display:none;align-items:center;justify-content:center;z-index:50}
#modal .box{background:#fff;border-radius:10px;padding:18px;width:min(560px,90vw)}
#modal h3{margin:0 0 10px;font-size:14px}
#modal textarea{width:100%;height:110px;border:1px solid var(--line);border-radius:6px;padding:8px;font:12px ui-monospace,Consolas,monospace;resize:none}
.grp:hover .port,.grp.sel .port{opacity:1}
.locked,.locked .ghit{cursor:default}
.tile{position:relative}
.tile img{width:36px;height:36px;object-fit:contain;pointer-events:none}
.tile i{position:absolute;top:0;right:2px;font-style:normal;color:var(--mute);display:none;cursor:pointer;padding:0 4px;font-size:14px}
.tile:hover i{display:block}
.tile.up{border:1px dashed var(--line);color:var(--mute);justify-content:center;cursor:pointer}
details.tipbox{margin-top:16px;border-top:1px solid var(--line);padding-top:10px}
details.tipbox summary{cursor:pointer;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--mute);font-weight:700;margin-bottom:8px}
.lrow{display:flex;align-items:center;gap:8px;margin-top:6px}
.lrow span{width:26px;flex:none;border-top:2px solid}
#drophint{position:absolute;inset:10px;border:2px dashed var(--accent);border-radius:10px;background:rgba(37,99,235,.05);display:none;align-items:center;justify-content:center;font-size:16px;color:var(--accent);pointer-events:none;z-index:8}
@media (max-width:1100px){body{grid-template-columns:232px 1fr 0}#right{display:none}.tiles{grid-template-columns:repeat(2,1fr)}.hide-sm{display:none}}
</style>
</head>
<body>
<header>
  <div class="brand"><i></i><span class="hide-sm">AWS Diagram Studio</span></div>
  <input id="title" type="text" aria-label="Diagram title" spellcheck="false">
  <div class="sep"></div>
  <button class="tb" data-act="new" title="Start a new diagram">New</button>
  <button class="tb" data-act="open" title="Open a saved JSON diagram">Open</button>
  <button class="tb" data-act="json" title="Save as JSON (Ctrl+S)">Save JSON</button>
  <div class="menu"><button class="tb primary" data-menu title="Export this diagram">Export &#9662;</button>
    <div class="mlist">
      <button data-act="png">PNG image <small>this page, 2x</small></button>
      <button data-act="pdf">PDF <small>vector, all pages</small></button>
      <button data-act="svg">SVG <small>this page, keeps animation</small></button>
      <button data-act="gif">Animated GIF <small>this page, flow dots</small></button>
    </div></div>
  <button class="tb" data-act="share" title="Copy a link that opens this diagram">Share link</button>
  <div class="sep"></div>
  <button class="tb" data-act="undo" title="Undo (Ctrl+Z)">Undo</button>
  <button class="tb" data-act="redo" title="Redo (Ctrl+Y)">Redo</button>
  <div class="sep"></div>
  <button class="tb" data-act="group" title="Group selection (G)">Group</button>
  <button class="tb" data-act="text" title="Add a text note (T)">Text</button>
  <div class="grow"></div>
  <button class="tb" data-act="play" title="Walk through the flow step by step (P)">&#9654; Present</button>
  <button class="tb on" data-act="anim" title="Play or stop flow animation for the whole diagram (A)">Animate</button>
  <button class="tb on hide-sm" data-act="grid" title="Show or hide the dot grid">Grid</button>
  <button class="tb on hide-sm" data-act="snap" title="Snap to grid">Snap</button>
  <button class="tb" data-act="zout" title="Zoom out">&minus;</button>
  <span id="zoomlbl">100%</span>
  <button class="tb" data-act="zin" title="Zoom in">+</button>
  <button class="tb" data-act="fit" title="Fit diagram to screen (F)">Fit</button>
</header>
<aside id="left">
  <input id="search" type="search" placeholder="Search services…  ( / )" aria-label="Search services">
  <div id="palette"></div>
</aside>
<main id="stage">
  <svg id="svg" xmlns="http://www.w3.org/2000/svg">
    <defs id="defs"></defs>
    <g id="world"><g id="lg"></g><g id="le"></g><g id="ln"></g><g id="lo"></g></g>
  </svg>
  <textarea id="editor" rows="1" spellcheck="false"></textarea>
  <div id="drophint">Drop a diagram .json to open it, or an image to use as an icon</div>
  <div id="tabs"></div>
  <div id="playbar"></div>
  <div id="toast"></div>
</main>
<aside id="right"></aside>
<input id="file" type="file" accept=".json,application/json" hidden>
<input id="imgfile" type="file" accept="image/png,image/jpeg,image/svg+xml,image/webp,image/gif" multiple hidden>
<div id="modal"><div class="box"><h3></h3><textarea readonly></textarea><div class="row"><button class="btn" data-close>Close</button></div></div></div>

    : `<button class="tab ${i === pg ? 'on' : ''}" data-pg="${i}" title="Double-click to rename">${esc(p.name)}${i === pg && doc.pages.length > 1 ? '<span data-pgdel title="Delete this page">×</span>' : ''}</button>`).join('') + '<button class="tab" data-pgadd title="Add a page">+</button>';
  const inp = $('#tabs input'); if (inp) { inp.focus(); inp.select(); }
}
function goPage(i) { finishEdit(true); if (play) stopPlay(); pg = Math.max(0, Math.min(doc.pages.length - 1, i)); sel.clear(); inspKey = null; fit(); }
$('#tabs').addEventListener('click', e => {
  if (e.target.closest('[data-pgdel]')) { doc.pages.splice(pg, 1); commit(); goPage(Math.min(pg, doc.pages.length - 1)); return toast('Page deleted — Undo brings it back'); }
  if (e.target.closest('[data-pgadd]')) { doc.pages.push({id: uid(), name: 'Page ' + (doc.pages.length + 1), items: [], edges: []}); commit(); pg = doc.pages.length - 1; sel.clear(); inspKey = null; view = {x: 40, y: 40, k: 1}; return draw(); }
  const b = e.target.closest('[data-pg]'); if (b && +b.dataset.pg !== pg) goPage(+b.dataset.pg);
});
$('#tabs').addEventListener('dblclick', e => { const b = e.target.closest('[data-pg]'); if (b) { tabEdit = +b.dataset.pg; draw(); } });
function endTabEdit(inp) { if (tabEdit < 0) return; const i = tabEdit; tabEdit = -1; doc.pages[i].name = inp.value.trim() || doc.pages[i].name; commit(); draw(); }
$('#tabs').addEventListener('focusout', e => { if (e.target.dataset.pgname) endTabEdit(e.target); });
$('#tabs').addEventListener('keydown', e => { if (e.target.dataset.pgname && (e.key === 'Enter' || e.key === 'Escape')) { e.preventDefault(); endTabEdit(e.target); } });

/* ---------- flow walkthrough ---------- */
function playList() {
  const es = doc.edges.filter(e => edgePts(e)), num = es.filter(e => e.step > 0);
  if (!num.length) return es.map((e, i) => ({n: i + 1, ids: [e.id]}));
  const m = new Map(); num.forEach(e => { if (!m.has(e.step)) m.set(e.step, []); m.get(e.step).push(e.id); });
  return [...m.keys()].sort((a, b) => a - b).map(n => ({n, ids: m.get(n)}));
}
function playState(e) { const i = play.list.findIndex(st => st.ids.includes(e.id)); return i < 0 || i > play.i ? 'future' : i === play.i ? 'cur' : 'done'; }
function caption(st) {
  const es = st.ids.map(edge).filter(Boolean), note = es.map(e => e.note).find(Boolean); if (note) return note;
  const nm = o => o ? String(o.label || (o.type === 'group' ? 'group' : 'item')).replace(/\n/g, ' ') : '?';
  return es.map(e => nm(item(e.from)) + ' → ' + nm(item(e.to)) + (e.label ? ' (' + e.label.replace(/\n/g, ' ') + ')' : '')).join('  ·  ');
}
function startPlay() {
  finishEdit(true); const list = playList(); if (!list.length) return toast('Connect some services first');
  play = {list, i: 0, paused: false}; sel.clear(); inspKey = null; showStep();
}
function showStep() {
  clearTimeout(playT); const st = play.list[play.i], cap = caption(st), last = play.i === play.list.length - 1;
  const bar = $('#playbar'); bar.style.display = 'flex';
  bar.innerHTML = `<button data-play="prev" title="Previous (←)">&#9664;</button><button data-play="toggle" title="Pause / play (Space)">${play.paused ? '&#9654;' : '&#10073;&#10073;'}</button><button data-play="next" title="Next (→)">&#9654;&#9654;</button><div><b>Step ${play.i + 1} of ${play.list.length}</b>${esc(cap)}</div><button data-play="stop" title="Exit (Esc)">&#10005;</button>`;
  draw();
  if (!play.paused) playT = setTimeout(() => { if (!play) return; if (last) play.paused = true; else play.i++; showStep(); }, 2600 + cap.length * 40);
}
function stepPlay(d) { if (!play) return; play.i = Math.max(0, Math.min(play.list.length - 1, play.i + d)); showStep(); }
function stopPlay() { clearTimeout(playT); play = null; $('#playbar').style.display = 'none'; draw(); }
$('#playbar').addEventListener('click', e => {
  const b = e.target.closest('[data-play]'); if (!b || !play) return;
  if (b.dataset.play === 'stop') stopPlay(); else if (b.dataset.play === 'toggle') { play.paused = !play.paused; if (!play.paused && play.i === play.list.length - 1) play.i = 0; showStep(); } else stepPlay(b.dataset.play === 'next' ? 1 : -1);
});

/* ---------- tidy: straighten near-aligned rows/columns, then even out near-even spacing ---------- */
function tidy() {
  let its = doc.items.filter(i => sel.has(i.id) && i.type !== 'group' && !i.locked);
  if (its.length < 2) its = doc.items.filter(i => i.type === 'node' && !i.locked);
  if (its.length < 2) return toast('Nothing to tidy yet');
  const mid = (it, ax) => { const b = box(it); return ax === 'x' ? b.x + b.w / 2 : b.y + b.h / 2; };
  let moved = 0;
  ['x', 'y'].forEach(ax => {
    const arr = its.slice().sort((a, b) => mid(a, ax) - mid(b, ax)); let cl = [arr[0]];
    const flush = () => {
      if (cl.length > 1) {
        // line up on the position most of them already share (preferring one that sits on the grid), not an average that moves everything
        const cnt = new Map(); cl.forEach(it => { const v = Math.round(mid(it, ax) * 2) / 2; cnt.set(v, (cnt.get(v) || 0) + 1); });
        const half = mid(cl[0], ax) - cl[0][ax], onGrid = v => Math.abs((v - half) / GRID - Math.round((v - half) / GRID)) < .01 ? 1 : 0;
        const target = [...cnt.keys()].sort((a, b) => cnt.get(b) - cnt.get(a) || onGrid(b) - onGrid(a))[0];
        cl.forEach(it => { const d = Math.round(target - mid(it, ax)); if (d) { it[ax] += d; moved++; } }); }
    };
    for (let i = 1; i < arr.length; i++) { if (mid(arr[i], ax) - mid(cl[cl.length - 1], ax) <= 20) cl.push(arr[i]); else { flush(); cl = [arr[i]]; } }
    flush();
  });
  ['x', 'y'].forEach(ax => {
    const other = ax === 'x' ? 'y' : 'x', lines = new Map();
    its.forEach(it => { const k = Math.round(mid(it, other)); if (!lines.has(k)) lines.set(k, []); lines.get(k).push(it); });
    lines.forEach(line => {
      if (line.length < 3) return;
      line.sort((a, b) => mid(a, ax) - mid(b, ax));
      const first = mid(line[0], ax), gap = (mid(line[line.length - 1], ax) - first) / (line.length - 1);
      if (line.some((it, i) => i && Math.abs(mid(it, ax) - mid(line[i - 1], ax) - gap) > Math.max(12, gap * .12))) return;
      line.forEach((it, i) => { const d = Math.round((first + gap * i - mid(it, ax)) / GRID) * GRID; if (d) { it[ax] += d; moved++; } });
    });
  });
  commit(); draw(); toast(moved ? 'Tidied — ' + moved + ' adjustment' + (moved === 1 ? '' : 's') + ' (Undo to revert)' : 'Already tidy');
}

/* ---------- actions / toolbar / keyboard ---------- */
function act(a) {
  if (play && !['play', 'zin', 'zout', 'fit', 'grid', 'share', 'png', 'pdf', 'svg', 'gif', 'json'].includes(a)) stopPlay();
  const c = centerWorld();
  switch (a) {
    case 'play': play ? stopPlay() : startPlay(); break;
    case 'share': share(); break;
    case 'gif': saveGIF(); break;
    case 'tidy': tidy(); break;
    case 'upload': $('#imgfile').click(); break;
    case 'lock': { const its = doc.items.filter(i => sel.has(i.id)); if (!its.length) break; const on = !its.every(i => i.locked); its.forEach(i => { if (on) i.locked = true; else delete i.locked; }); commit(); inspKey = null; draw(); toast(on ? 'Locked — it stays put until you unlock it (L)' : 'Unlocked'); break; }
    case 'front': case 'back': { const m = doc.items.filter(i => sel.has(i.id)), r = doc.items.filter(i => !sel.has(i.id)); doc.items = a === 'front' ? r.concat(m) : m.concat(r); commit(); draw(); break; }
    case 'nextstep': { const n = nextStep(); doc.edges.forEach(e => { if (sel.has(e.id)) e.step = n; }); commit(); inspKey = null; draw(); break; }
    case 'restoreprev': { try { const prev = JSON.parse(localStorage.getItem(STORE + '.prev')); localStorage.removeItem(STORE + '.prev'); load(prev); mineKey = null; draw(); toast('Restored your previous diagram'); } catch (e) { toast('Nothing to restore'); } break; }
    case 'new': finishEdit(true); pg = 0; doc = blank(); sel.clear(); inspKey = null; $('#title').value = doc.title; commit(); view = {x: 40, y: 40, k: 1}; draw(); toast('New diagram — Undo brings the last one back'); break;
    case 'open': $('#file').click(); break;
    case 'json': saveJSON(); break;
    case 'png': savePNG(); break;
    case 'pdf': savePDF(); break;
    case 'svg': saveSVG(); break;
    case 'undo': travel(-1); break;
    case 'redo': travel(1); break;
    case 'group': doc.items.some(i => sel.has(i.id)) ? addGroup('generic', c.x, c.y, true) : toast('Select the services to group first'); break;
    case 'text': addText(c.x - 40, c.y - 10); break;
    case 'del': del(); break;
    case 'dup': if (copy()) paste(false); break;
    case 'unbend': { const e = edge([...sel][0]); if (e) { delete e.bend; commit(); inspKey = null; draw(); } break; }
    case 'reverse': { const e = edge([...sel][0]); if (e) { [e.from, e.to] = [e.to, e.from]; commit(); draw(); } break; }
    case 'selin': { const g = item([...sel][0]); if (g) { const gb = box(g); doc.items.forEach(i => { if (i !== g && inside(box(i), gb)) sel.add(i.id); }); draw(); } break; }
    case 'snap': snapOn = !snapOn; prefs(); break;
    case 'anim': {
      const any = doc.edges.some(e => e.anim), playing = doc.animate !== false && any;
      if (!doc.edges.length) { toast('Connect some services first'); break; }
      if (playing) { doc.animate = false; toast('Animation off'); }
      else { doc.animate = true; if (!any) doc.edges.forEach(e => { e.anim = true; }); toast(any ? 'Animation on' : 'Animating all ' + doc.edges.length + ' connectors'); }
      commit(); inspKey = null; draw(); break;
    }
    case 'grid': gridOn = !gridOn; prefs(); draw(); break;
    case 'animon': case 'animoff': doc.edges.forEach(e => { if (sel.has(e.id)) { if (a === 'animon') e.anim = true; else delete e.anim; } }); commit(); draw(); break;
    case 'zin': zoomAt(1.2); break;
    case 'zout': zoomAt(1 / 1.2); break;
    case 'fit': fit(); break;
  }
}
function prefs(skipSave) {
  document.querySelector('[data-act=snap]').classList.toggle('on', snapOn);
  document.querySelector('[data-act=grid]').classList.toggle('on', gridOn);
  if (!skipSave) try { localStorage.setItem(PREFS, JSON.stringify({snap: snapOn, grid: gridOn})); } catch (e) {}
}
document.querySelector('header').addEventListener('click', e => {
  const mb = e.target.closest('[data-menu]'), menu = document.querySelector('.menu');
  if (mb) return menu.classList.toggle('open');
  menu.classList.remove('open');
  const b = e.target.closest('[data-act]'); if (b) act(b.dataset.act);
});
document.addEventListener('pointerdown', e => { if (!e.target.closest('.menu')) document.querySelector('.menu').classList.remove('open'); });
$('#title').addEventListener('input', e => { doc.title = e.target.value; });
$('#title').addEventListener('change', () => { doc.title = doc.title.trim() || 'Untitled diagram'; $('#title').value = doc.title; commit(); });
$('#title').addEventListener('keydown', e => { if (e.key === 'Enter') e.target.blur(); });
window.addEventListener('keydown', e => {
  const tag = e.target.tagName, typing = (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') && !(e.target === editor && !editing), mod = e.ctrlKey || e.metaKey, k = e.key.toLowerCase();
  if (mod && k === 's') { e.preventDefault(); saveJSON(); return; }
  if (typing) { if (e.key === 'Escape') e.target.blur(); return; }
  if ($('#modal').style.display === 'flex') { if (e.key === 'Escape') $('#modal').style.display = 'none'; return; }
  if (play) {
    if (e.key === 'Escape' || k === 'p') stopPlay(); else if (e.key === 'ArrowRight') stepPlay(1); else if (e.key === 'ArrowLeft') stepPlay(-1);
    else if (e.key === ' ') { play.paused = !play.paused; showStep(); } else return;
    e.preventDefault(); return;
  }
  if (e.key === ' ') { spaceDown = true; stage.classList.add('pan'); e.preventDefault(); return; }
  if (mod) {
    if (k === 'z') { e.preventDefault(); travel(e.shiftKey ? 1 : -1); }
    else if (k === 'y') { e.preventDefault(); travel(1); }
    else if (k === 'c') copy();
    else if (k === 'x') { if (copy()) { removeIds(moveSet().map(i => i.id)); commit(); draw(); } }
    else if (k === 'v') paste(true);
    else if (k === 'd') { e.preventDefault(); act('dup'); }
    else if (k === 'g') { e.preventDefault(); act('group'); }
    else if (k === 'a') { e.preventDefault(); sel = new Set(doc.items.filter(i => !i.locked).map(i => i.id).concat(doc.edges.map(i => i.id))); draw(); }
    return;
  }
  const step = e.shiftKey ? GRID * 4 : (snapOn ? GRID : 1);
  if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); del(); }
  else if (e.key === 'Escape') { sel.clear(); draw(); }
  else if ((e.key === 'Enter' || e.key === 'F2') && sel.size === 1) { e.preventDefault(); startEdit([...sel][0]); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); nudge(-step, 0); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); nudge(step, 0); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); nudge(0, -step); }
  else if (e.key === 'ArrowDown') { e.preventDefault(); nudge(0, step); }
  else if (k === 'g') { e.preventDefault(); act('group'); }
  else if (k === 't') { e.preventDefault(); act('text'); }
  else if (k === 'f') { e.preventDefault(); fit(); }
  else if (k === 'a') { e.preventDefault(); act('anim'); }
  else if (k === 'p') { e.preventDefault(); act('play'); }
  else if (k === 'l') { e.preventDefault(); act('lock'); }
  else if (k === '/') { e.preventDefault(); $('#search').focus(); }
  else if (k === '+' || k === '=') zoomAt(1.2);
  else if (k === '-') zoomAt(1 / 1.2);
});
window.addEventListener('keyup', e => { if (e.key === ' ') { spaceDown = false; stage.classList.remove('pan'); } });
window.addEventListener('blur', () => { spaceDown = false; stage.classList.remove('pan'); });
window.addEventListener('resize', draw);

/* ---------- boot ---------- */
const SAMPLE = {title: 'Serverless web app', items: [
  {id: 'g1', type: 'group', kind: 'cloud', x: 232, y: 40, w: 728, h: 448, label: 'AWS Cloud'},
  {id: 'g2', type: 'group', kind: 'region', x: 264, y: 96, w: 664, h: 360, label: 'us-west-2'},
  {id: 'n1', type: 'node', icon: 'users', x: 72, y: 216, label: 'Users'},
  {id: 'n2', type: 'node', icon: 'cloudfront', x: 312, y: 216, label: 'CloudFront'},
  {id: 'n3', type: 'node', icon: 's3', x: 312, y: 352, label: 'Static site bucket'},
  {id: 'n4', type: 'node', icon: 'apigw', x: 472, y: 216, label: 'API Gateway'},
  {id: 'n5', type: 'node', icon: 'cognito', x: 472, y: 352, label: 'Cognito'},
  {id: 'n6', type: 'node', icon: 'lambda', x: 632, y: 216, label: 'API handlers'},
  {id: 'n7', type: 'node', icon: 'dynamodb', x: 800, y: 144, label: 'DynamoDB'},
  {id: 'n8', type: 'node', icon: 's3', x: 800, y: 296, label: 'Data bucket'},
], edges: [
  {id: 'e1', from: 'n1', to: 'n2', label: 'HTTPS'}, {id: 'e2', from: 'n2', to: 'n3'}, {id: 'e3', from: 'n2', to: 'n4'},
  {id: 'e4', from: 'n4', to: 'n6'}, {id: 'e5', from: 'n4', to: 'n5', dash: true, label: 'authorize'},
  {id: 'e6', from: 'n6', to: 'n7'}, {id: 'e7', from: 'n6', to: 'n8'},
]};
buildPalette();
try { const pf = JSON.parse(localStorage.getItem(PREFS)); if (pf) { snapOn = pf.snap !== false; gridOn = pf.grid !== false; } } catch (e) {}
prefs(true);
(async () => {
  let shared = null, bad = false;
  const m = /^#d=(.+)$/.exec(location.hash);
  if (m) {
    try { shared = JSON.parse(await unpack(m[1])); normalize(shared); } catch (e) { shared = null; bad = true; }
    try { window.history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
  }
  let saved = null, raw = null;
  try { raw = localStorage.getItem(STORE); saved = JSON.parse(raw); } catch (e) {}
  if (shared) {
    // keep whatever was being worked on here so opening someone's link never destroys it
    try { if (raw && saved && (saved.pages || saved.items)) localStorage.setItem(STORE + '.prev', raw); } catch (e) {}
    load(shared, true); toast('Opened the shared diagram', 4000);
  } else {
    try { load(saved && (saved.pages || saved.items) ? saved : SAMPLE, true); } catch (e) { load(SAMPLE, true); }
    if (bad) toast('That share link is damaged or incomplete', 5000);
  }
  requestAnimationFrame(fit);
})();
})();
</script>
