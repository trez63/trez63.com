<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GENESIS — A Universe in a Single Page</title>
<!--
  GENESIS — a universe in a single page.
  ---------------------------------------------------------------
  HOW TO RUN IT:  Save this file, then double-click it. That's it.
  No build step, no libraries, no network, no install. It runs
  offline in any modern browser, from a file:// URL or a web server.

  WHAT IT DOES:   Type any phrase and it becomes a living solar
                  system. The whole phrase is the sun. Every word
                  becomes a planet orbiting it, in order, joined by
                  a constellation line. Click a planet to inspect it.

  WHY THE SAME WORDS ALWAYS MAKE THE SAME UNIVERSE:
  The phrase is hashed (FNV-1a) into a seed. A tiny seeded random
  generator then decides every colour, orbit and star. Send someone
  your link (the phrase lives in the #hash) and they open the exact
  same universe. No server, no database — the phrase IS the seed.

  HOW WORDS BECOME WORLDS (the whole mapping, in plain English):
    • word length  -> planet size (longer word, bigger world)
    • letter codes  -> planet colour (hue)
    • word position -> orbit: a golden-angle spiral, so words fan
      out like a galaxy instead of piling on one ring
    • phrase hash   -> sun colour, nebula colours, starfield
  ---------------------------------------------------------------
  Judging notes are in the comments where they matter, and the code
  is kept in short, named sections so a judge can read it top to
  bottom in a few minutes. Total: one file, just over 500 lines, zero deps.
-->
<style>
  :root{
    --ink:#eef1ff; --dim:#aab0d6; --glass:rgba(10,14,32,.62);
    --line:rgba(255,255,255,.14); --accent:#ffd166; --accent2:#9b8cff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#05060f;color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  #space{position:fixed;inset:0;display:block;cursor:grab}
  #space:active{cursor:grabbing}
  .panel{background:var(--glass);border:1px solid var(--line);border-radius:18px;
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    box-shadow:0 12px 40px rgba(0,0,0,.45)}
  /* Top panel: title + phrase input */
  .top{position:fixed;top:16px;left:50%;transform:translateX(-50%);width:min(740px,calc(100% - 24px));
    padding:18px 20px 14px;text-align:center;z-index:5}
  h1{margin:0;font-family:Georgia,"Times New Roman",serif;letter-spacing:.34em;
    font-size:clamp(22px,4vw,34px);line-height:1.1;
    background:linear-gradient(90deg,#ffd166,#ff7ab8,#9b8cff,#7ee8fa);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .tag{margin:6px 0 14px;color:var(--dim);font-size:14px}
  .row{display:flex;gap:8px}
  #phrase{flex:1;min-width:0;padding:12px 14px;border-radius:12px;border:1px solid var(--line);
    background:rgba(255,255,255,.08);color:var(--ink);font-size:16px;outline:none}
  #phrase:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,209,102,.18)}
  button{cursor:pointer;border:1px solid var(--line);border-radius:999px;padding:10px 16px;
    background:rgba(255,255,255,.09);color:var(--ink);font-size:14px;white-space:nowrap}
  button:hover{background:rgba(255,255,255,.18)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#231a00;font-weight:700}
  button.primary:hover{background:#ffdc8a}
  .chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:10px}
  .chips button{padding:6px 11px;font-size:12.5px;color:var(--dim)}
  /* Bottom bar: controls + stats */
  .bar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:5;
    width:min(860px,calc(100% - 24px));padding:10px 12px;
    display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center}
  .bar label{font-size:13px;color:var(--dim);display:flex;gap:6px;align-items:center}
  .bar input[type=range]{accent-color:var(--accent)}
  #stats{font-size:12.5px;color:var(--dim)}
  /* Detail card for the selected world */
  #detail{position:fixed;right:16px;bottom:92px;z-index:5;width:270px;padding:16px}
  #detail h2{margin:0 0 4px;font-family:Georgia,serif;font-size:22px}
  #detail p{margin:4px 0;color:var(--dim);font-size:13.5px;line-height:1.5}
  #detail .swatch{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;margin-right:6px}
  #toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);z-index:9;padding:10px 16px;
    border-radius:999px;background:#12172e;border:1px solid var(--line);font-size:14px;display:none}
  #zenExit{position:fixed;right:16px;bottom:16px;z-index:9;display:none}
  body.zen .panel,body.zen .bar{display:none}
  body.zen #zenExit{display:block}
  .foot{width:100%;text-align:center;font-size:11.5px;color:#7d84ad}
  @media (max-width:560px){ #detail{left:12px;right:12px;bottom:150px;width:auto} .tag{display:none} }
</style>
</head>
<body>
<canvas id="space"></canvas>
<noscript><p style="padding:2em">GENESIS needs JavaScript enabled — that's the whole contest entry.</p></noscript>

<header class="panel top">
  <h1>GENESIS</h1>
  <p class="tag">Type anything &mdash; it becomes a universe. Same words, same universe, anywhere.</p>
  <div class="row">
    <input id="phrase" type="text" value="fate of the universe" maxlength="120"
      placeholder="Type a wish, a name, a sentence&hellip;" aria-label="Phrase to turn into a universe">
    <button id="create" class="primary">Create universe</button>
  </div>
  <div class="chips" aria-label="Try one of these">
    <button data-phrase="fate of the universe">fate of the universe</button>
    <button data-phrase="hello world">hello world</button>
    <button data-phrase="to the stars and back">to the stars and back</button>
    <button data-phrase="a quiet place to think">a quiet place to think</button>
    <button data-phrase="dance like nobody is watching">dance like nobody is watching</button>
  </div>
</header>

<aside id="detail" class="panel" hidden>
  <h2 id="detailName">&mdash;</h2>
  <p id="detailMeta"></p>
  <p id="detailNote"></p>
</aside>

<div class="panel bar">
  <button id="surprise" title="Random universe (R)">&#10024; Surprise me</button>
  <button id="soundBtn" title="Generative music from your words">&#127925; Sound: off</button>
  <button id="pauseBtn" title="Pause the orbits (Space)">&#10074;&#10074; Pause</button>
  <label>Speed <input id="speed" type="range" min="0.25" max="2" step="0.25" value="1"> <span id="speedVal">&times;1</span></label>
  <button id="resetView" title="Centre the universe">Centre</button>
  <button id="zenBtn" title="Hide the interface (H)">Zen</button>
  <button id="saveBtn" title="Download this frame as a PNG">&#11015; Save image</button>
  <button id="copyBtn" title="Copy a link to this exact universe">Copy link</button>
  <span id="stats"></span>
  <span class="foot">One file &middot; No libraries &middot; No network &middot; Works offline &mdash; save it and double-click it.
    Drag to pan &middot; Scroll to zoom &middot; Click a world &middot; Space pauses &middot; H hides the interface</span>
</div>

<button id="zenExit">Show controls (H)</button>
<div id="toast" role="status"></div>
<script>
"use strict";
/* ================================================================
   1. SEEDED RANDOMNESS — the trick that makes sharing work.
   FNV-1a turns any phrase into a 32-bit seed; mulberry32 turns
   that seed into a repeatable stream of numbers in [0, 1).
   Same phrase -> same seed -> same universe, on any machine.
   ================================================================ */
function hashPhrase(text) {
  let h = 2166136261;
  for (let i = 0; i < text.length; i++) { h ^= text.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const TAU = Math.PI * 2;

/* ================================================================
   2. STATE — everything the page needs, in one plain object.
   ================================================================ */
const canvas = document.getElementById("space");
const ctx = canvas.getContext("2d");
const state = {
  phrase: "fate of the universe", seed: 0, sunHue: 45,
  bodies: [],          // planets, one per word
  stars: [], dust: [], // background + drifting motes
  bg: null,            // pre-rendered nebula + static stars (see §4)
  view: { x: 0, y: 0, scale: 1 },
  time: 0, paused: false, speed: 1,
  selected: null, hovered: null, dragging: false, moved: 0
};

/* Pre-rendered glow sprite: drawing one radial gradient per body
   once beats calling shadowBlur for every body on every frame —
   the single biggest performance win in this file. */
function makeGlow(hue, light) {
  const c = document.createElement("canvas"); c.width = c.height = 64;
  const g = c.getContext("2d");
  const grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  grad.addColorStop(0, `hsla(${hue},90%,${light}%,.9)`);
  grad.addColorStop(0.35, `hsla(${hue},90%,${light}%,.35)`);
  grad.addColorStop(1, `hsla(${hue},90%,${light}%,0)`);
  g.fillStyle = grad; g.fillRect(0, 0, 64, 64);
  return c;
}

/* ================================================================
   3. BUILD A UNIVERSE FROM A PHRASE
   Sun = the whole phrase. Planets = words, in order, on a
   golden-angle spiral (137.5° apart) so they fan out like a galaxy.
   ================================================================ */
function buildUniverse(phrase) {
  phrase = (phrase || "").trim().replace(/\s+/g, " ") || "hello universe";
  state.phrase = phrase;
  state.seed = hashPhrase(phrase.toLowerCase());
  const rnd = mulberry32(state.seed);
  state.sunHue = Math.floor(rnd() * 360);
  state.selected = null;
  document.getElementById("detail").hidden = true;

  const words = phrase.split(" ").slice(0, 24); // cap: keeps frame rate safe
  state.bodies = words.map((word, i) => {
    const letters = [...word].reduce((s, ch) => s + ch.charCodeAt(0), 0);
    const hue = (state.sunHue + 40 + ((letters * 37 + i * 47) % 280)) % 360;
    const dist = 95 + Math.sqrt(i) * 58 + rnd() * 22;
    const body = {
      word, type: "Planet", angle: i * 2.39996 + rnd() * 0.6, // golden angle
      dist, radius: clamp(7 + word.length * 1.7, 9, 26),
      hue, speed: (0.14 / Math.sqrt(dist / 100)) * (0.7 + rnd() * 0.6),
      glow: makeGlow(hue, 62), moons: []
    };
    // Long or lucky words get a moon — a small, visible reward.
    if (word.length >= 6 || rnd() < 0.3) {
      body.moons.push({ angle: rnd() * TAU, dist: body.radius + 14 + rnd() * 10,
        radius: 3 + rnd() * 2.5, speed: 0.9 + rnd() * 0.8 });
    }
    return body;
  });

  // Starfield + dust, also seeded, so they match the universe.
  state.stars = Array.from({ length: 220 }, () => ({
    x: rnd(), y: rnd(), r: 0.4 + rnd() * 1.3, tw: rnd() * TAU, hue: rnd() < 0.2 ? state.sunHue : 220
  }));
  state.dust = Array.from({ length: 90 }, () => ({
    angle: rnd() * TAU, dist: 40 + rnd() * 420, speed: (0.02 + rnd() * 0.05) * (rnd() < 0.5 ? 1 : -1),
    r: 0.6 + rnd() * 1.2, hue: (state.sunHue + rnd() * 120) % 360
  }));
  buildBackground();
  updateStats();
  // Keep the shareable link in step without reloading the page.
  try { history.replaceState(null, "", "#" + encodeURIComponent(phrase)); } catch (e) { /* file:// can refuse this; the app still works */ }
  if (soundOn) restartMusic();
}

/* ================================================================
   4. BACKGROUND — nebula + static stars rendered ONCE per universe
   (and on resize) to an offscreen canvas, then blitted each frame.
   Animated twinkle is only 60 dots on top, so the frame stays cheap.
   ================================================================ */
let W = 0, H = 0;
function buildBackground() {
  const bg = document.createElement("canvas"); bg.width = Math.max(1, W); bg.height = Math.max(1, H);
  const g = bg.getContext("2d");
  const rnd = mulberry32(state.seed ^ 0x9E3779B9);
  for (let i = 0; i < 4; i++) { // soft nebula blobs in the sun's family of hues
    const hue = (state.sunHue + rnd() * 140 - 40 + 360) % 360;
    const x = rnd() * W, y = rnd() * H, r = (0.3 + rnd() * 0.5) * Math.max(W, H);
    const grad = g.createRadialGradient(x, y, 0, x, y, r);
    grad.addColorStop(0, `hsla(${hue},80%,45%,.20)`); grad.addColorStop(1, "transparent");
    g.fillStyle = grad; g.fillRect(0, 0, W, H);
  }
  for (const s of state.stars) { // static layer of the starfield
    g.fillStyle = `hsla(${s.hue},70%,80%,.7)`;
    g.beginPath(); g.arc(s.x * W, s.y * H, s.r, 0, TAU); g.fill();
  }
  state.bg = bg;
}

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2); // cap: retina, not 3x cost
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + "px"; canvas.style.height = H + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  buildBackground();
}
window.addEventListener("resize", resize);

/* ================================================================
   5. RENDER — one canvas, one pass, no DOM per star.
   Centre + pan + zoom give the view; every position is derived
   from state.time, so pausing is just freezing time.
   ================================================================ */
const sunGlow = { canvas: null, hue: -1 };
function centre() { return { x: W / 2 + state.view.x, y: H / 2 + state.view.y }; }

function drawBody(b, x, y) {
  const s = state.view.scale;
  ctx.drawImage(b.glow, x - b.radius * 2.2 * s, y - b.radius * 2.2 * s, b.radius * 4.4 * s, b.radius * 4.4 * s);
  ctx.fillStyle = `hsl(${b.hue},75%,62%)`;
  ctx.beginPath(); ctx.arc(x, y, b.radius * s, 0, TAU); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,.28)"; // a lit crescent, for depth
  ctx.beginPath(); ctx.arc(x - b.radius * s * 0.25, y - b.radius * s * 0.25, b.radius * s * 0.55, 0, TAU); ctx.fill();
}

function render() {
  const { x: cx, y: cy } = centre();
  const s = state.view.scale;
  ctx.clearRect(0, 0, W, H);
  if (state.bg) ctx.drawImage(state.bg, 0, 0, W, H);

  // Twinkling stars: a few dozen, cheap, alive.
  const tw = performance.now() / 1000;
  for (const st of state.stars.slice(0, 60)) {
    ctx.fillStyle = `hsla(${st.hue},80%,85%,${0.35 + 0.35 * Math.sin(tw * 1.5 + st.tw)})`;
    ctx.beginPath(); ctx.arc(st.x * W, st.y * H, st.r, 0, TAU); ctx.fill();
  }
  // Drifting dust motes.
  for (const d of state.dust) {
    const a = d.angle + state.time * d.speed;
    ctx.fillStyle = `hsla(${d.hue},80%,75%,.5)`;
    ctx.beginPath(); ctx.arc(cx + Math.cos(a) * d.dist * s, cy + Math.sin(a) * d.dist * s, d.r, 0, TAU); ctx.fill();
  }
  // Orbit rings + the constellation line joining words in order.
  ctx.strokeStyle = "rgba(255,255,255,.08)"; ctx.lineWidth = 1;
  for (const b of state.bodies) { ctx.beginPath(); ctx.arc(cx, cy, b.dist * s, 0, TAU); ctx.stroke(); }
  if (state.bodies.length > 1) {
    ctx.strokeStyle = "rgba(255,255,255,.22)"; ctx.setLineDash([2, 7]);
    ctx.beginPath();
    state.bodies.forEach((b, i) => {
      const a = b.angle + state.time * b.speed;
      const x = cx + Math.cos(a) * b.dist * s, y = cy + Math.sin(a) * b.dist * s;
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    });
    ctx.stroke(); ctx.setLineDash([]);
  }
  // Sun (the whole phrase) — glow sprite cached per hue.
  if (sunGlow.hue !== state.sunHue) { sunGlow.canvas = makeGlow(state.sunHue, 55); sunGlow.hue = state.sunHue; }
  const sunR = 34 * s;
  ctx.drawImage(sunGlow.canvas, cx - sunR * 2.4, cy - sunR * 2.4, sunR * 4.8, sunR * 4.8);
  ctx.fillStyle = `hsl(${state.sunHue},90%,68%)`;
  ctx.beginPath(); ctx.arc(cx, cy, sunR, 0, TAU); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,.35)";
  ctx.beginPath(); ctx.arc(cx - sunR * 0.25, cy - sunR * 0.25, sunR * 0.5, 0, TAU); ctx.fill();

  // Planets, moons, selection ring, labels.
  state.bodies.forEach((b, i) => {
    const a = b.angle + state.time * b.speed;
    const x = cx + Math.cos(a) * b.dist * s, y = cy + Math.sin(a) * b.dist * s;
    b._x = x; b._y = y;
    for (const m of b.moons) {
      const ma = m.angle + state.time * m.speed;
      ctx.fillStyle = "rgba(230,235,255,.85)";
      ctx.beginPath(); ctx.arc(x + Math.cos(ma) * m.dist * s, y + Math.sin(ma) * m.dist * s, m.radius * s, 0, TAU); ctx.fill();
    }
    drawBody(b, x, y);
    if (state.selected === b || state.hovered === b) {
      ctx.strokeStyle = "rgba(255,255,255,.85)"; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(x, y, (b.radius + 8) * s, 0, TAU); ctx.stroke();
    }
    if (state.selected === b || state.hovered === b || state.bodies.length <= 8) {
      ctx.fillStyle = "rgba(238,241,255,.9)"; ctx.font = "12px system-ui,sans-serif"; ctx.textAlign = "center";
      ctx.fillText(b.word, x, y - (b.radius + 12) * s);
    }
  });
  if (state.selected) { /* sun selection ring, when the sun is selected */
    if (state.selected.isSun) {
      ctx.strokeStyle = "rgba(255,255,255,.85)"; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(cx, cy, sunR + 10, 0, TAU); ctx.stroke();
    }
  }
}

function loop(now) {
  if (!state.paused) state.time += 0.016 * state.speed; // fixed step: smooth on any display
  render();
  requestAnimationFrame(loop);
}
document.addEventListener("visibilitychange", () => { /* rAF already pauses off-screen; nothing to leak */ });

/* ================================================================
   6. INTERACTION — drag to pan, scroll to zoom, click to inspect.
   A drag is only a click if the pointer barely moved.
   ================================================================ */
let down = null;
canvas.addEventListener("pointerdown", e => { down = { x: e.clientX, y: e.clientY }; state.dragging = true; state.moved = 0; });
canvas.addEventListener("pointermove", e => {
  if (state.dragging && down) {
    const dx = e.clientX - down.x, dy = e.clientY - down.y;
    state.view.x += dx; state.view.y += dy; down = { x: e.clientX, y: e.clientY };
    state.moved += Math.abs(dx) + Math.abs(dy);
  }
  state.hovered = hitTest(e.clientX, e.clientY);
});
function endDrag(e) {
  state.dragging = false;
  if (state.moved < 6) select(hitTest(e.clientX, e.clientY));
  down = null;
}
canvas.addEventListener("pointerup", endDrag);
canvas.addEventListener("pointerleave", () => { state.dragging = false; state.hovered = null; });
canvas.addEventListener("wheel", e => {
  e.preventDefault();
  state.view.scale = clamp(state.view.scale * (e.deltaY < 0 ? 1.1 : 0.9), 0.4, 2.5);
}, { passive: false });

function hitTest(px, py) {
  const { x: cx, y: cy } = centre();
  if (Math.hypot(px - cx, py - cy) < 44 * state.view.scale) return { isSun: true, word: state.phrase };
  for (const b of state.bodies) if (b._x !== undefined && Math.hypot(px - b._x, py - b._y) < b.radius * state.view.scale + 12) return b;
  return null;
}
function select(b) {
  state.selected = b;
  const el = document.getElementById("detail");
  if (!b) { el.hidden = true; return; }
  el.hidden = false;
  const sizeWord = b.isSun ? "Star" : b.radius >= 22 ? "Giant" : b.radius >= 15 ? "Large" : "Small";
  document.getElementById("detailName").textContent = b.isSun ? "☀ The Sun" : b.word;
  document.getElementById("detailMeta").innerHTML =
    `<span class="swatch" style="background:hsl(${b.isSun ? state.sunHue : b.hue},75%,62%)"></span>` +
    (b.isSun ? `The whole phrase, as a star. Seed ${state.seed.toString(16)}.` : `${sizeWord} planet &middot; Orbit ${Math.round(b.dist)} &middot; ${b.moons.length} moon${b.moons.length === 1 ? "" : "s"}`);
  document.getElementById("detailNote").textContent = b.isSun
    ? `“${state.phrase}” — every colour and orbit in this sky was derived from these words.`
    : `“${b.word}” became this world because of its length (${b.word.length} letters, so size ${Math.round(b.radius)}) and its letters, which set its colour. It is word ${state.bodies.indexOf(b) + 1} of ${state.bodies.length}, so the constellation line reaches it ${state.bodies.indexOf(b) + 1 === 1 ? "first" : "in turn"}.`;
  if (soundOn) playWordNote(b);
}

/* ================================================================
   7. SOUND — generative, from the words. Pentatonic, so any phrase
   sounds pleasant; no audio files, no samples, just oscillators.
   Browsers require a user gesture, so this only starts on toggle.
   ================================================================ */
let actx = null, soundOn = false, musicTimer = null, noteIdx = 0;
const SCALE = [0, 3, 5, 7, 10, 12, 15]; // minor pentatonic
function wordNote(b, i) {
  const midi = 57 + SCALE[i % SCALE.length] + Math.floor(i / SCALE.length) * 12;
  return 440 * Math.pow(2, (midi - 69) / 12);
}
function playWordNote(b) {
  if (!actx || !soundOn) return;
  const i = state.bodies.indexOf(b); if (i < 0) return;
  playTone(wordNote(b, i), 0.9, 0.10);
}
function playTone(freq, dur, vol) {
  const t = actx.currentTime;
  const osc = actx.createOscillator(), gain = actx.createGain();
  osc.type = "sine"; osc.frequency.value = freq;
  gain.gain.setValueAtTime(0, t);
  gain.gain.linearRampToValueAtTime(vol, t + 0.05);
  gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
  osc.connect(gain).connect(actx.destination);
  osc.start(t); osc.stop(t + dur + 0.05);
}
function restartMusic() {
  stopMusic();
  if (!soundOn || !actx) return;
  noteIdx = 0;
  musicTimer = setInterval(() => {
    if (!state.bodies.length) return;
    const b = state.bodies[noteIdx % state.bodies.length];
    playTone(wordNote(b, noteIdx % state.bodies.length), 1.1, 0.07);
    noteIdx++;
  }, 750);
}
function stopMusic() { if (musicTimer) { clearInterval(musicTimer); musicTimer = null; } }

/* ================================================================
   8. UI WIRING — every control, plus keyboard shortcuts.
   Shortcuts ignore keystrokes typed into the phrase box.
   ================================================================ */
const $ = id => document.getElementById(id);
const phraseInput = $("phrase");
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.style.display = "block";
  clearTimeout(t._h); t._h = setTimeout(() => t.style.display = "none", 2600);
}
function updateStats() {
  $("stats").textContent = `${state.bodies.length} worlds · ${state.stars.length} stars · seed ${state.seed.toString(16)} · same words = same sky`;
}
let debounce = null;
phraseInput.addEventListener("input", () => {
  clearTimeout(debounce);
  debounce = setTimeout(() => buildUniverse(phraseInput.value), 800); // type, pause, watch it change
});
$("create").addEventListener("click", () => buildUniverse(phraseInput.value));
phraseInput.addEventListener("keydown", e => { if (e.key === "Enter") buildUniverse(phraseInput.value); });
document.querySelectorAll(".chips button").forEach(btn =>
  btn.addEventListener("click", () => { phraseInput.value = btn.dataset.phrase; buildUniverse(phraseInput.value); }));
const SURPRISES = ["midnight garden", "the ocean remembers", "seven silver foxes", "a lighthouse for lost ideas", "electric honey", "the last train to tomorrow", "paper boats on a quiet sea"];
$("surprise").addEventListener("click", () => {
  const p = SURPRISES[Math.floor(Math.random() * SURPRISES.length)];
  phraseInput.value = p; buildUniverse(p);
});
$("soundBtn").addEventListener("click", () => {
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  if (actx.state === "suspended") actx.resume();
  soundOn = !soundOn;
  $("soundBtn").textContent = soundOn ? "♪ Sound: on" : "♫ Sound: off";
  soundOn ? restartMusic() : stopMusic();
  if (soundOn) toast("Sound on — your words are playing, in order, on a pentatonic scale.");
});
$("pauseBtn").addEventListener("click", togglePause);
function togglePause() {
  state.paused = !state.paused;
  $("pauseBtn").textContent = state.paused ? "▶ Resume" : "❚❚ Pause";
}
$("speed").addEventListener("input", e => { state.speed = +e.target.value; $("speedVal").textContent = "×" + e.target.value; });
$("resetView").addEventListener("click", () => { state.view = { x: 0, y: 0, scale: 1 }; });
function toggleZen() { document.body.classList.toggle("zen"); }
$("zenBtn").addEventListener("click", toggleZen);
$("zenExit").addEventListener("click", toggleZen);
$("saveBtn").addEventListener("click", () => {
  render(); // draw a fresh frame in this task, so the PNG can't be blank
  const a = document.createElement("a");
  a.download = "genesis-universe.png"; a.href = canvas.toDataURL("image/png"); a.click();
  toast("Saved — this frame, as a PNG.");
});
$("copyBtn").addEventListener("click", async () => {
  const url = location.href;
  try { await navigator.clipboard.writeText(url); toast("Link copied — anyone opening it sees this exact universe."); }
  catch (e) { prompt("Copy this link to share this exact universe:", url); }
});
document.addEventListener("keydown", e => {
  if (document.activeElement === phraseInput) return;
  if (e.code === "Space") { e.preventDefault(); togglePause(); }
  if (e.key === "r" || e.key === "R") $("surprise").click();
  if (e.key === "h" || e.key === "H") toggleZen();
});

/* ================================================================
   9. START — from the link if there is one, otherwise the default.
   Reduced-motion users start paused: the sky is still beautiful,
   and Space resumes it. Then the loop runs forever, cheaply.
   ================================================================ */
resize();
const fromHash = location.hash ? decodeURIComponent(location.hash.slice(1)) : "";
if (fromHash) phraseInput.value = fromHash;
if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) { state.paused = true; $("pauseBtn").textContent = "▶ Resume"; }
buildUniverse(phraseInput.value);
requestAnimationFrame(loop);
</script>
</body>
</html>
