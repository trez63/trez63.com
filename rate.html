<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vote — trez63</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="assets/favicon-64.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<style>
:root{--bg:#eff1f5;--panel:#fff;--line:#dce1e9;--fg:#17212d;--mute:#677180;--acc:#244fe5;--yellow:#e5ff80;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.6 Arial,Helvetica,sans-serif}
a{color:inherit}
.wrap{max-width:860px;margin:0 auto;padding:32px 24px 80px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:23px}
.eyebrow{font:11px/1.4 "Courier New",monospace;letter-spacing:1.1px;color:var(--acc);text-transform:uppercase;margin:0 0 10px}
.back{color:var(--fg);text-decoration:none;font-weight:800;font-size:15px;letter-spacing:-.6px;display:inline-block;margin-bottom:18px}
.head{display:flex;gap:24px;align-items:flex-start;margin:20px 0 28px;flex-wrap:wrap}
.head img{width:280px;max-width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:12px;border:1px solid var(--line);background:#000}
h1{margin:0 0 6px;font-size:40px;font-weight:800;letter-spacing:-2px;line-height:1}
.desc{color:var(--mute);margin:0 0 16px}
.play{display:inline-block;background:var(--fg);color:#fff;font-weight:700;font-size:12px;padding:11px 14px;border-radius:7px;text-decoration:none}
.play:hover{filter:brightness(1.15)}
.hint{display:flex;align-items:center;gap:20px;padding:16px 23px;background:var(--fg);color:#fff;border-radius:12px;margin:18px 0 14px;flex-wrap:wrap;font-size:14px}
.hint a{color:#fff}
.hint .tag{font-size:10px;background:var(--yellow);color:var(--fg);padding:7px 10px;border-radius:5px;white-space:nowrap;font-weight:700;margin-left:auto}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="./" title="All apps"><img src="assets/logo.png" alt="trez63.com" style="height:56px;width:auto;display:block"></a>
  <div class="card">
  <div class="eyebrow">Vote for this app</div>
  <div class="head">
    <img id="thumb" alt="">
    <div>
      <h1 id="title">…</h1>
      <p class="desc" id="desc"></p>
      <a class="play" id="play" href="#">Play it</a>
    </div>
  </div>
  <p class="hint"><span>Built by an AI from <a href="./#prompt">the same one-line brief</a> every app here gets, with no edits after. <strong>Vote with a 👍 below</strong> — one per GitHub account. Comments welcome too.</span><span class="tag">👍 = ONE VOTE</span></p>
  <div id="giscus"></div>
  </div>
</div>
<script>
(async () => {
  const slug = new URLSearchParams(location.search).get('app') || '';
  const safe = /^[a-z0-9-]+$/.test(slug) ? slug : '';
  const cat = await fetch('catalog.json', {cache: 'no-cache'}).then(r => r.json()).catch(() => ({apps:{}}));
  const e = cat.apps[safe];
  if (!e) { document.getElementById('title').textContent = 'App not found'; document.getElementById('play').remove(); return; }
  document.title = `Vote: ${e.title} — trez63`;
  document.getElementById('title').textContent = e.title;
  document.getElementById('desc').textContent = e.description || '';
  document.getElementById("play").href = `p/${safe}.html`;
  document.getElementById('thumb').src = `thumbs/${safe}.webp`;
  const s = document.createElement('script');
  Object.entries({
    src: 'https://giscus.app/client.js',
    'data-repo': 'trez63/trez63.com',
    'data-repo-id': 'R_kgDOVXH-4g',
    'data-category': 'App votes',
    'data-category-id': 'DIC_kwDOVXH-4s4DJnEN',
    'data-mapping': 'specific',
    'data-term': `app:${safe}`,
    'data-strict': '1',
    'data-reactions-enabled': '1',
    'data-emit-metadata': '0',
    'data-input-position': 'top',
    'data-theme': 'preferred_color_scheme',
    'data-lang': 'en',
    crossorigin: 'anonymous', async: ''
  }).forEach(([k, v]) => s.setAttribute(k, v));
  document.getElementById('giscus').appendChild(s);
})();
</script>
</body>
</html>
