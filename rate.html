<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vote — trez63</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#fbfbfd;--panel:#ffffff;--line:#e4e6ef;--fg:#0b0d17;--mute:#5b6075;--acc:#2b5cff}
@media (prefers-color-scheme: dark){:root{--bg:#0b0d17;--panel:#12152a;--line:#232742;--fg:#eef0ff;--mute:#8d93b0;--acc:#5b8cff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:inherit}
.wrap{max-width:820px;margin:0 auto;padding:40px 24px 80px}
.back{color:var(--mute);text-decoration:none;font-size:14px}
.head{display:flex;gap:24px;align-items:flex-start;margin:20px 0 28px;flex-wrap:wrap}
.head img{width:280px;max-width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:12px;border:1px solid var(--line);background:#000}
h1{margin:0 0 6px;font-size:34px;font-weight:800;letter-spacing:-.03em}
.desc{color:var(--mute);margin:0 0 16px}
.play{display:inline-block;background:var(--acc);color:#fff;font-weight:700;padding:11px 20px;border-radius:999px;text-decoration:none;box-shadow:0 8px 24px -6px rgba(43,92,255,.45)}
.hint{color:var(--mute);font-size:13px;margin:0 0 10px}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="./">← All apps</a>
  <div class="head">
    <img id="thumb" alt="">
    <div>
      <h1 id="title">…</h1>
      <p class="desc" id="desc"></p>
      <a class="play" id="play" href="#">Play it</a>
    </div>
  </div>
  <p class="hint">Built by an AI from <a href="./#prompt">the same one-line brief</a> every app here gets, with no edits after. <strong>Vote with a 👍 below.</strong> One vote per GitHub account — sign in, tap the thumbs-up, done. Comments welcome too.</p>
  <div id="giscus"></div>
</div>
<script>
(async () => {
  const slug = new URLSearchParams(location.search).get('app') || '';
  const safe = /^[a-z0-9-]+$/.test(slug) ? slug : '';
  const cat = await fetch('catalog.json', {cache: 'no-cache'}).then(r => r.json()).catch(() => ({apps:{}}));
  const e = cat.apps[safe];
  if (!e) { document.getElementById('title').textContent = 'App not found'; document.getElementById('play').remove(); return; }
  document.title = `Vote: ${e.title} — trez63`;
  document.getElementById('title').textContent = e.title;
  document.getElementById('desc').textContent = e.description || '';
  document.getElementById("play").href = `p/${safe}.html`;
  document.getElementById('thumb').src = `thumbs/${safe}.webp`;
  const s = document.createElement('script');
  Object.entries({
    src: 'https://giscus.app/client.js',
    'data-repo': 'trez63/trez63.com',
    'data-repo-id': 'R_kgDOVXH-4g',
    'data-category': 'App votes',
    'data-category-id': 'DIC_kwDOVXH-4s4DJnEN',
    'data-mapping': 'specific',
    'data-term': `app:${safe}`,
    'data-strict': '1',
    'data-reactions-enabled': '1',
    'data-emit-metadata': '0',
    'data-input-position': 'top',
    'data-theme': 'preferred_color_scheme',
    'data-lang': 'en',
    crossorigin: 'anonymous', async: ''
  }).forEach(([k, v]) => s.setAttribute(k, v));
  document.getElementById('giscus').appendChild(s);
})();
</script>
</body>
</html>
